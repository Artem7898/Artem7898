<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Artem Alimpiev — Python Backend Engineer</title>
<desc id="desc">Python backends, AI workflows, and developer tools. An animated decorative sequence connects schema, execution, and evidence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#EAF5F3"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087F72"/><stop offset="0.55" stop-color="#60A5FA"/><stop offset="1" stop-color="#7853C9"/></linearGradient>
  <radialGradient id="tealGlow"><stop stop-color="#087F72" stop-opacity="0.14"/><stop offset="1" stop-color="#087F72" stop-opacity="0"/></radialGradient>
  <radialGradient id="violetGlow"><stop stop-color="#7853C9" stop-opacity="0.12"/><stop offset="1" stop-color="#7853C9" stop-opacity="0"/></radialGradient>
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#5C8BA7" opacity="0.18"/></pattern>
  <clipPath id="frame"><rect x="1" y="1" width="1278" height="438" rx="24"/></clipPath>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .mono { font-family: 'DejaVu Sans Mono', Consolas, monospace; }
  .trace { stroke-dasharray:18 104; animation:flow 5s linear infinite; }
  .halo { animation:glow 6s ease-in-out infinite; }
  @keyframes flow { from { stroke-dashoffset:0; } to { stroke-dashoffset:-122; } }
  @keyframes glow { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .trace,.halo { animation:none; } }
</style>
<rect x="1" y="1" width="1278" height="438" rx="24" fill="url(#bg)" stroke="#C8DCE3"/>
